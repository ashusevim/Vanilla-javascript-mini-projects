<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Scheme Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <a class="back-link" href="../index.html">← Back</a>

  <main class="stage">
    <h1>Color Scheme Switcher</h1>
    <p class="hint">Pick a background — solid or gradient. Click the code to copy it.</p>

    <div class="tabs" role="tablist" aria-label="Palette type">
      <button class="tab is-active" data-tab="solid" role="tab" aria-selected="true">Solids</button>
      <button class="tab" data-tab="gradient" role="tab" aria-selected="false">Gradients</button>
    </div>

    <div class="swatches" id="swatches" role="group" aria-label="Background colors"></div>

    <button class="code-chip" id="code" type="button" title="Click to copy">
      <span id="code-text">Pick a color</span>
      <span class="copy-hint" id="copy-hint">copy</span>
    </button>
  </main>

  <script src="project1.js"></script>
</body>

</html>
