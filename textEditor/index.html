<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Formatter</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <a class="back-link" href="../index.html">← Back</a>

  <main class="editor">
    <h2>Text Formatter</h2>

    <textarea id="input" placeholder="Type or paste your text…" rows="4"></textarea>

    <div class="toolbar" id="toolbar">
      <div class="group">
        <button class="tool" data-case="upper" title="UPPERCASE">AA</button>
        <button class="tool" data-case="lower" title="lowercase">aa</button>
        <button class="tool" data-case="title" title="Title Case">Aa</button>
      </div>
      <div class="group">
        <button class="tool" data-style="bold" title="Bold"><b>B</b></button>
        <button class="tool" data-style="italic" title="Italic"><i>I</i></button>
        <button class="tool" data-style="underline" title="Underline"><u>U</u></button>
        <button class="tool" data-style="strike" title="Strikethrough"><s>S</s></button>
      </div>
    </div>

    <div class="output" id="output">Your formatted text appears here…</div>

    <footer class="bar">
      <span class="stats"><span id="chars">0</span> chars · <span id="words">0</span> words</span>
      <button class="copy" id="copy">Copy</button>
    </footer>
  </main>

  <script src="project11.js"></script>
</body>

</html>
