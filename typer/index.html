<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Typer</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <a class="back-link" href="../index.html">← Back</a>

  <main class="stage">
    <p class="line">
      <span class="prefix">JavaScript is</span>
      <span class="typed-text" id="typed"></span><span class="cursor" id="cursor" aria-hidden="true"></span>
    </p>

    <div class="controls">
      <label class="ctrl">
        Speed
        <input type="range" id="speed" min="20" max="220" value="110" />
      </label>
      <div class="cursors" id="cursors" role="group" aria-label="Cursor style">
        <button class="cbtn is-active" data-cursor="bar" title="Bar">▏</button>
        <button class="cbtn" data-cursor="block" title="Block">▮</button>
        <button class="cbtn" data-cursor="underscore" title="Underscore">_</button>
      </div>
    </div>
  </main>

  <script src="project8.js"></script>
</body>

</html>
