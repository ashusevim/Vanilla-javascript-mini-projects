<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="back-link" href="../index.html">← Back</a>

    <div class="card" id="card">
        <form class="search" id="search">
            <input class="user_input" id="input" type="text" placeholder="Search a city…" spellcheck="false" aria-label="City name">
            <button type="submit" aria-label="Search">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.49-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            </button>
        </form>

        <div class="body" id="body">
            <p class="placeholder" id="placeholder">Search for a city to see the weather ⛅</p>

            <div class="weather" id="weather" hidden>
                <div class="icon" id="icon">☀️</div>
                <div class="temp" id="temp">--°</div>
                <div class="place" id="place"></div>
                <div class="desc" id="desc"></div>

                <div class="stats">
                    <div class="stat"><span id="feels">--</span><label>Feels like</label></div>
                    <div class="stat"><span id="humidity">--</span><label>Humidity</label></div>
                    <div class="stat"><span id="wind">--</span><label>Wind</label></div>
                </div>

                <div class="range">
                    <span id="lo">L: --°</span>
                    <span id="hi">H: --°</span>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
