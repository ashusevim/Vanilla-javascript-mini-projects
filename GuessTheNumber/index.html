<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="back-link" href="../index.html">← Back</a>
    <canvas id="confetti"></canvas>

    <main id="wrapper">
        <h1>Guess the Number</h1>
        <p class="sub">I'm thinking of a number between <strong>1</strong> and <strong>100</strong>.</p>

        <div class="thermo" aria-hidden="true">
            <div class="thermo-fill" id="thermo"></div>
        </div>
        <p class="feedback" id="feedback">Take a guess…</p>

        <form class="form" id="form">
            <input type="number" id="guessField" min="1" max="100" inputmode="numeric" placeholder="1–100" autofocus />
            <button type="submit" id="subt">Guess</button>
        </form>

        <div class="stats">
            <div class="stat"><span id="attempts">0</span><label>Guesses</label></div>
            <div class="stat"><span id="remaining">10</span><label>Left</label></div>
        </div>

        <div class="chips" id="history"></div>
    </main>

    <script src="project4.js"></script>
</body>

</html>
