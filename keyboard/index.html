<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyboard Event Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <a class="back-link" href="../index.html">← Back</a>

  <main class="stage">
    <h1>Keyboard Explorer</h1>
    <p class="hint">Press any key — see it light up and inspect the event.</p>

    <div class="info" id="info">
      <div class="info-card"><span id="v-key">—</span><label>key</label></div>
      <div class="info-card"><span id="v-code">—</span><label>code</label></div>
      <div class="info-card"><span id="v-which">—</span><label>keyCode</label></div>
      <div class="info-card"><span id="v-loc">—</span><label>location</label></div>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <div class="history-wrap">
      <span class="h-label">Recent keys</span>
      <div class="history" id="history"></div>
    </div>
  </main>

  <script src="project5.js"></script>
</body>

</html>
