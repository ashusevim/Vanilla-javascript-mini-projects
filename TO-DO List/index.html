<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="back-link" href="../index.html">← Back</a>

    <div class="box">
        <header class="head">
            <h2>To-Do List</h2>
            <span class="count" id="count">0 tasks</span>
        </header>

        <form class="input-box" id="form">
            <input type="text" class="task" id="task" placeholder="What needs doing?" autocomplete="off">
            <button class="add" type="submit" aria-label="Add task">+</button>
        </form>

        <div class="filters" id="filters">
            <button class="filter is-active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="done">Done</button>
            <button class="clear" id="clear-done">Clear done</button>
        </div>

        <ul id="list"></ul>

        <p class="empty" id="empty">Nothing here yet — add your first task! ✨</p>
    </div>

    <script src="index.js"></script>
</body>

</html>
