<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>BMI Calculator</title>
</head>

<body>
  <a class="back-link" href="../index.html">← Back</a>
  <div class="card">
    <h1>BMI Calculator</h1>

    <div class="unit-toggle" role="group" aria-label="Unit system">
      <button class="u-btn is-active" data-unit="metric">Metric</button>
      <button class="u-btn" data-unit="imperial">Imperial</button>
    </div>

    <form id="bmi-form" autocomplete="off">
      <div class="fields">
        <label>
          <span id="h-label">Height (cm)</span>
          <input type="number" id="height" min="1" step="0.1" placeholder="175" required />
        </label>
        <label>
          <span id="w-label">Weight (kg)</span>
          <input type="number" id="weight" min="1" step="0.1" placeholder="70" required />
        </label>
      </div>
      <button class="submit" type="submit">Calculate</button>
    </form>

    <div class="result" id="result" aria-live="polite" hidden>
      <svg class="gauge" viewBox="0 0 200 110" aria-hidden="true">
        <path class="gauge-bg" d="M20,100 A80,80 0 0,1 180,100" />
        <path class="gauge-fill" id="gauge-fill" d="M20,100 A80,80 0 0,1 180,100" />
        <circle class="gauge-dot" id="gauge-dot" r="6" cx="20" cy="100" />
      </svg>
      <div class="bmi-value" id="bmi-value"></div>
      <div class="bmi-cat" id="bmi-cat"></div>
    </div>

    <div class="guide">
      <h3>BMI Guide</h3>
      <span class="g low">Underweight &lt; 18.5</span>
      <span class="g ok">Normal 18.5–24.9</span>
      <span class="g high">Overweight 25–29.9</span>
      <span class="g vhigh">Obese ≥ 30</span>
    </div>
  </div>
  <script src="project2.js"></script>
</body>

</html>
